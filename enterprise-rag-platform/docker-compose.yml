services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes

  db-migrate:
    image: pgvector/pgvector:pg17
    environment:
      PGPASSWORD: rag
    volumes:
      - ./infra/postgres/init.sql:/migrations/init.sql:ro
    command: ["psql", "-h", "postgres", "-U", "rag", "-d", "rag", "-f", "/migrations/init.sql"]
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-api:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    env_file: .env
    ports: ["8001:8001"]
    volumes: ["objects:/data/objects"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    volumes: ["objects:/data/objects"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  serving-api:
    build:
      context: .
      dockerfile: services/serving/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  ui:
    build:
      context: ./ui
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [serving-api]

volumes:
  pgdata:
  objects:
