[project]
name = "enterprise-rag-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.5",
  "psycopg[binary,pool]>=3.2",
  "redis>=5.0",
  "arq>=0.26",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/rag_core"]

[tool.pytest.ini_options]
pythonpath = ["packages/rag_core", "services/ingestion", "services/serving"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "SIM117"]
