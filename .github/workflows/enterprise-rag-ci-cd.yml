name: Enterprise RAG CI/CD

on:
  pull_request:
    paths:
      - "enterprise-rag-platform/**"
      - ".github/workflows/enterprise-rag-ci-cd.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "enterprise-rag-platform/**"
      - ".github/workflows/enterprise-rag-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: enterprise-rag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-rag-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: enterprise-rag-platform/pyproject.toml

      - name: Install Python dependencies
        run: pip install -e '.[dev]'

      - name: Lint Python
        run: ruff check packages services tests

      - name: Run Python tests
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: enterprise-rag-platform/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build UI
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm --prefix ui run build

  containers:
    name: Build ${{ matrix.name }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ingestion-api
            context: enterprise-rag-platform
            dockerfile: enterprise-rag-platform/services/ingestion/Dockerfile
          - name: ingestion-worker
            context: enterprise-rag-platform
            dockerfile: enterprise-rag-platform/Dockerfile.worker
          - name: serving-api
            context: enterprise-rag-platform
            dockerfile: enterprise-rag-platform/services/serving/Dockerfile
          - name: ui
            context: enterprise-rag-platform/ui
            dockerfile: enterprise-rag-platform/ui/Dockerfile

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/enterprise-rag-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: containers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: git archive --format=zip --output=enterprise-rag-platform-${{ github.ref_name }}.zip HEAD:enterprise-rag-platform
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: enterprise-rag-platform-${{ github.ref_name }}.zip
